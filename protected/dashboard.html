<!DOCTYPE html>
<html lang="en">

<head>
  <title>My account | LUXCV</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0B0D">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/account.css">

  <script>document.documentElement.classList.add('js');</script>
</head>

<body class="page-account" data-page="dashboard">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="LUXCV home">
        <img class="brand__mark" src="assets/icons/logo-mark.svg" width="28" height="28" alt="">
        <span>LUX<span class="brand__accent">CV</span></span>
      </a>
      <div class="account-bar">
        <a class="btn btn--ghost btn--sm" href="templates.html">Templates</a>
        <a class="btn btn--secondary btn--sm" href="admin.html" data-admin-link hidden>Admin dashboard</a>
        <button class="btn btn--secondary btn--sm" type="button" data-action="logout">Log out</button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="container dash">
      <div>
        <p class="eyebrow">My account</p>
        <h1 class="dash__title" id="welcome">Welcome</h1>
      </div>

      <div class="alert alert--error" id="dash-alert" role="alert" tabindex="-1" hidden></div>

      <div class="dash__grid">
        <section class="panel-card" aria-labelledby="account-title">
          <h2 class="panel-card__title" id="account-title">Account</h2>
          <dl class="facts">
            <div><dt>Name</dt><dd data-fact="name">-</dd></div>
            <div><dt>Email</dt><dd data-fact="email">-</dd></div>
            <div><dt>Member since</dt><dd data-fact="since">-</dd></div>
          </dl>
          <button class="btn btn--secondary btn--block" type="button" data-action="logout">Log out</button>
        </section>

        <section class="panel-card" aria-labelledby="resumes-title">
          <div class="panel-card__head">
            <h2 class="panel-card__title" id="resumes-title">Your saved resumes</h2>
            <a class="btn btn--primary btn--sm" href="templates.html">Start a new resume</a>
          </div>
          <div id="resume-host" aria-live="polite"><p class="empty-card">Loading…</p></div>
        </section>
      </div>
    </div>
  </main>

  <dialog class="modal modal--sm" id="delete-resume-dialog" aria-labelledby="delete-resume-title"
    aria-describedby="delete-resume-text">
    <div class="modal__panel">
      <div class="modal__header">
        <h2 class="modal__title" id="delete-resume-title">Delete this resume?</h2>
      </div>
      <div class="modal__body">
        <p id="delete-resume-text">This permanently deletes the saved resume from your account. It can’t be undone.</p>
      </div>
      <div class="modal__footer">
        <span></span>
        <div class="modal__actions">
          <button class="btn btn--secondary" type="button" data-dialog-close="cancel" autofocus>Keep it</button>
          <button class="btn btn--danger" type="button" data-dialog-close="confirm">Delete resume</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="js/data-model.js" defer></script>
  <script src="js/dom.js" defer></script>
  <script src="js/dialog.js" defer></script>
  <script src="js/auth-client.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</body>

</html>
